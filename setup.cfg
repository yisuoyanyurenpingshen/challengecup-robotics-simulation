[metadata]
name = smartclean-sim
version = 0.1.0
description = 面向 RDK 国产机器人平台的智慧环卫无人清扫车仿真核心
long_description = file: README.md
long_description_content_type = text/markdown
license = Proprietary

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.8
include_package_data = True

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    smartclean-sim = smartclean_sim.cli:main

[tool:pytest]
addopts = -q
testpaths = tests
